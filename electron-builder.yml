# Installer für den Kanzlei-Helfer (Vorlage: Machbar).
# appId und productName bleiben fest: Sie bestimmen Installationsort und Datenordner.
appId: de.echoblend.kanzlei-helfer
productName: Kanzlei-Helfer
copyright: Timo Bergmann

directories:
  output: paket
  buildResources: public

# Nur das Gebaute und die Hülle. Alle Pakete stecken gebündelt in dist (devDependencies).
files:
  - dist/**
  - electron/**
  - public/icon.png
  - package.json

win:
  target: nsis
  icon: public/icon.png
  # Ohne gekaufte Code-Signatur warnt Windows beim ersten Start („Weitere Informationen → Trotzdem ausführen“).

nsis:
  # Ein Klick, nur für den angemeldeten Benutzer: %LOCALAPPDATA%\Programs\Kanzlei-Helfer.
  # Mit oneClick + perMachine: false enthält der Installer gar keinen Weg zu Adminrechten (RequestExecutionLevel user, kein UAC).
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kanzlei-Helfer
  artifactName: Kanzlei-Helfer-Setup-${version}.exe
  # Deinstallieren entfernt auch %APPDATA%\Kanzlei-Helfer (Vorlagen, Gruppen, Protokoll, .eml-Ausgang).
  # Ein Update (neue Setup-Datei über die alte) behält die Daten: Der Installer ruft das alte Deinstallationsprogramm mit --updated auf.
  deleteAppDataOnUninstall: true

publish: null
