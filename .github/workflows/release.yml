# Baut den Windows-Installer und veröffentlicht ihn als GitHub-Release:
# bei einem Tag v* oder von Hand (Actions → Release → Run workflow); dann legt das Release den Tag v<Version> selbst an.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pruefe
      - run: npm run bau
      # Netz-Wächter auf Windows: echte App, NetLog – kein Release, wenn irgendetwas außer DATEVconnect angefragt wird
      - run: npm run pruefe:netz
      - run: npm run installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Prüfsumme
        shell: pwsh
        run: |
          $f = Get-ChildItem paket/Kanzlei-Helfer-Setup-*.exe | Select-Object -First 1
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($f.Name)" | Out-File -Encoding ascii "$($f.FullName).sha256"
      - name: Release anlegen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "v" + (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "Windows-Installer: ein Klick, nur für den angemeldeten Benutzer, ohne Adminrechte (nicht signiert: SmartScreen → Weitere Informationen → Trotzdem ausführen). Deinstallieren über Windows-Einstellungen → Apps entfernt auch alle Daten. Nichts geht ins Internet (vor dem Release per NetLog auf Windows geprüft); DATEV wird nur gelesen; Mails nur als Outlook-Entwürfe, Empfänger immer in BCC. DATEVconnect-Standard: LIZENZSERVER."
          gh release create $v (Get-ChildItem paket/Kanzlei-Helfer-Setup-*) --target "${{ github.sha }}" --title "Kanzlei-Helfer $v" --notes $notes
